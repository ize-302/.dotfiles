# Installed to /etc/sddm.conf.d/ by install.sh
[General]
# The greeter runs on X before sway starts, so it doesn't get sway's output
# scales (config/sway/config) and the laptop's panel draws everything at 1x,
# smaller than the lock screen. Give Qt the same scale per output, by X's
# output names (the modesetting driver's, which match sway's).
GreeterEnvironment=QT_SCREEN_SCALE_FACTORS=eDP-1=1.4;DP-2=1

[Theme]
Current=custom

[X11]
DisplayCommand=/etc/sddm/Xsetup
