# Installed to /etc/sddm.conf.d/ by install.sh. The login screen runs in its
# own mango (mangifera's /etc/sddm/mango.conf), which scales every output 1x,
# so the laptop's panel would draw everything tiny. Give Qt a scale per
# output, by mango's output names.
[General]
GreeterEnvironment=QT_SCREEN_SCALE_FACTORS=eDP-1=1.4;DP-2=1
