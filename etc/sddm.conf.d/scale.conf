# Installed to /etc/sddm.conf.d/ by install.sh. The login screen runs on X
# before sway starts, so it doesn't get sway's output scales
# (config/sway/config.d/outputs.conf) and the laptop's panel draws everything
# at 1x. Give Qt the same scale per output, by X's output names (the
# modesetting driver's, which match sway's).
[General]
GreeterEnvironment=QT_SCREEN_SCALE_FACTORS=eDP-1=1.4;DP-2=1
