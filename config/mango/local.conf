# This machine's displays, sourced last by mangifera's config.conf.
# Layout: external on the left, laptop on the right. `mmsg get all-monitors`
# lists the names.
# DP-2 does 120 Hz over this HDMI link, but defaults to 60
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:120,x:0,y:0,scale:1
monitor_rule=name:^eDP-1$,x:1920,y:0,scale:1.5
