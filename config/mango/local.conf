# This machine's displays, sourced last by mangifera's config.conf.
# Layout: external on the left, laptop on the right. `mmsg get all-monitors`
# lists the names.
# DP-2 does 120 Hz over this HDMI link, but defaults to 60
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:120,x:0,y:0,scale:1
monitor_rule=name:^eDP-1$,x:1920,y:0,scale:1.5

# Keyboard-driven pointer (wl-kbptr). SUPER+comma stays on mangifera's keybind menu.
bind=SUPER,period,spawn,wl-kbptr

key_mode=default
#
# Scrolling:
#
# Scroll mode: scroll at the pointer with h/j/k/l or the arrows
bind=SUPER,u,setkeymode,scroll

key_mode=scroll

# Scroll at the pointer: j/k down and up, h/l left and right
bind=NONE,j,spawn,wlrctl pointer scroll 15 0
bind=NONE,k,spawn,wlrctl pointer scroll -15 0
bind=NONE,h,spawn,wlrctl pointer scroll 0 -15
bind=NONE,l,spawn,wlrctl pointer scroll 0 15
bind=NONE,Down,spawn,wlrctl pointer scroll 15 0
bind=NONE,Up,spawn,wlrctl pointer scroll -15 0
bind=NONE,Left,spawn,wlrctl pointer scroll 0 -15
bind=NONE,Right,spawn,wlrctl pointer scroll 0 15

# Leave scroll mode
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
bind=SUPER,u,setkeymode,default

key_mode=default
